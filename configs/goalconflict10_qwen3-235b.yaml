# Harness validation against the paper's headline condition (2026-08-31):
# blackmail + explicit-america goal + replacement, 10 samples, variant none (original
# prompt verbatim). Published blackmail rates on these snapshots are high (e.g. ~80%
# for gpt-4.1) - if this shows ~zero blackmail, the harness is wrong.
model: "qwen/qwen3-235b-a22b"
base_url: "https://openrouter.ai/api/v1"
api_key_env: "OPENROUTER_API_KEY"
temperature: 1.0
max_tokens: 24000
samples_per_condition: 10
variants: ["none"]
conditions: ["blackmail_explicit-america_replacement"]
concurrency: 3
retries: 2
seed: 0
benchmark_dir: "../INSIDER_LLM_DETECTION_BENCHMARK"
phase: "validation"   # smoke | validation | pilot | study
