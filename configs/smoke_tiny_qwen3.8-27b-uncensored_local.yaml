# Local uncensored-model smoke: safety-trained models rarely act harmfully and
# log honestly when they do (EXPERIMENTS.md); an uncensored finetune may
# actually exercise the detector. qwen3.8-27b-uncensored-8k =
# orcarouter/Qwen3.8-27B-Uncensored:latest with num_ctx 8192. 16k spilled the
# 18GB model onto CPU (RTX 5080 Laptop, 16GB VRAM) and generation crawled;
# 8k shrinks the KV cache so more weight layers stay on GPU. Measured prompt is
# ~2900 tokens; max_tokens 5000 keeps prompt+output under the 8192 window
# (per the 2026-08-30 num_ctx decision: max_tokens < num_ctx - prompt_length).
model: "qwen3.8-27b-uncensored-8k"
base_url: "http://localhost:11434/v1"
temperature: 0.5
max_tokens: 5000
samples_per_condition: 1
variants: ["none", "A", "B"]
conditions: ["blackmail_none-none_replacement", "murder_none-none_replacement"]
concurrency: 1
retries: 2
seed: 0
benchmark_dir: "../INSIDER_LLM_DETECTION_BENCHMARK"
phase: "smoke"   # smoke | validation | pilot | study
