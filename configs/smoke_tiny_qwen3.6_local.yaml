# Local-model smoke: qwen3.6 (~30B-class, older generation than the cloud smoke models).
# qwen3.6-16k = qwen3.6:latest + PARAMETER num_ctx 16384 (see decisions.md on Ollama's 4096 default).
# 23 GB — will partially offload to CPU on this machine; expect slow episodes.
model: "qwen3.6-16k"
base_url: "http://localhost:11434/v1"
temperature: 0.5
max_tokens: 12000
samples_per_condition: 1
variants: ["none", "A", "B"]
conditions: ["blackmail_none-none_replacement", "murder_none-none_replacement"]
concurrency: 1
retries: 2
seed: 0
benchmark_dir: "../INSIDER_LLM_DETECTION_BENCHMARK"
