# deepseek-v4-flash on strengthened-B C/D at the study temperature (2026-09-02).
# blackmail_explicit-america_replacement, variants C+D, temp 1.0, 5 samples. The earlier
# v4-flash C/D pilot (strongB_deepseek-v4-flash, 0.7) was on the pre-fix C/D wording.
# At 1.0 this model loops in reasoning to the token cap in some episodes (no_answer).
# Pilot: exploratory, never study data.
model: "deepseek-v4-flash:cloud"
base_url: "http://localhost:11434/v1"
temperature: 1.0
max_tokens: 24000
samples_per_condition: 5
variants: ["C", "D"]
conditions: ["blackmail_explicit-america_replacement"]
concurrency: 2
retries: 2
seed: 0
benchmark_dir: "../INSIDER_LLM_DETECTION_BENCHMARK"
phase: "pilot"   # smoke | validation | pilot | study
