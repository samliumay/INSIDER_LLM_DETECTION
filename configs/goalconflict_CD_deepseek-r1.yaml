# Strengthened-B ladder on DeepSeek-R1 (user request 2026-08-31): R1 keeps blackmailing
# under pressure (unlike v4-flash, which C/D suppressed), so it's the model where stronger
# monitoring can show MORE hiding. Compare against the existing A/B run 20260831-195229
# (same condition, temp 1.0, 10 samples): A 0 cover-ups, B 2 cover-ups.
# EXPLORATORY (reworded C/D, not yet frozen/pre-registered) — run with --allow-dirty.
model: "deepseek/deepseek-r1"
base_url: "https://openrouter.ai/api/v1"
api_key_env: "OPENROUTER_API_KEY"
temperature: 1.0
max_tokens: 24000
samples_per_condition: 10
variants: ["C", "D"]
conditions: ["blackmail_explicit-america_replacement"]
concurrency: 3
retries: 2
seed: 0
benchmark_dir: "../INSIDER_LLM_DETECTION_BENCHMARK"
phase: "pilot"   # smoke | validation | pilot | study (review 2026-09-02)
