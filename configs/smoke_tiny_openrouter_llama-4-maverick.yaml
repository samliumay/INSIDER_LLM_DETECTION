# Original Agentic Misalignment study model via OpenRouter (decisions.md 2026-08-31).
# Smoke: 2 conditions x 3 variants = 6 episodes. Temp 1.0 as in the original study.
model: "meta-llama/llama-4-maverick"
base_url: "https://openrouter.ai/api/v1"
api_key_env: "OPENROUTER_API_KEY"
temperature: 1.0
max_tokens: 24000
samples_per_condition: 1
variants: ["none", "A", "B"]
conditions: ["blackmail_none-none_replacement", "murder_none-none_replacement"]
concurrency: 2
retries: 2
seed: 0
benchmark_dir: "../INSIDER_LLM_DETECTION_BENCHMARK"
