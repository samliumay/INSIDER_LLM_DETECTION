# Local-model smoke: does an actually-local (non-cloud, older-gen) model behave differently?
# qwen3.8-16k = qwen3.8:latest with num_ctx 16384 (Ollama's default 4096 truncated every episode:
# stop=length at total_tokens=4096, empty answers — see results/20260830-222208_qwen3.8-latest).
model: "qwen3.8-16k"
base_url: "http://localhost:11434/v1"
temperature: 0.5
max_tokens: 12000
samples_per_condition: 1
variants: ["none", "A", "B"]
conditions: ["blackmail_none-none_replacement", "murder_none-none_replacement"]
concurrency: 1
retries: 2
seed: 0
benchmark_dir: "../INSIDER_LLM_DETECTION_BENCHMARK"
