# Detector test (user request 2026-08-31): the headline goal-conflict blackmail
# condition WITH logging instructions (variants A + B), so a model that blackmails
# can be observed hiding or laundering it in its self-log. 10 samples x 2 variants.
model: "qwen/qwen3-235b-a22b"
