name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The benchmark tag and upstream commit are read from [tool.ild] in pyproject.toml by the
# code itself; the `pins` job exports them so the runner and CI cannot drift.
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen --group dev
      - run: uv run python -c "import insider_llm_detection.parse, insider_llm_detection.run, insider_llm_detection.classify, insider_llm_detection.eval, insider_llm_detection.ci"

  test:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen --group dev
      - run: uv run pytest -q

  fixture:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen --group dev
      # fails on any derived-field mismatch; prints every transition into not_logged
      - run: uv run ild fixture-check --fixtures tests/fixtures

  benchmark:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen --group dev
      - name: read pins from pyproject.toml
        id: pins
        run: |
          uv run python -c "import tomllib;t=tomllib.load(open('pyproject.toml','rb'))['tool']['ild'];print(f\"tag={t['benchmark_tag']}\");print(f\"upstream={t['upstream_commit']}\")" >> "$GITHUB_OUTPUT"
      - name: clone benchmark at the declared tag
        run: git clone --depth 1 --branch "${{ steps.pins.outputs.tag }}" https://huggingface.co/datasets/logicBombExe/INSIDER_LLM_DETECTION_BENCHMARK ../INSIDER_LLM_DETECTION_BENCHMARK
      - name: clone upstream at the pinned commit
        run: |
          git clone https://github.com/anthropic-experimental/agentic-misalignment ../related_repos/agentic-misalignment
          git -C ../related_repos/agentic-misalignment checkout "${{ steps.pins.outputs.upstream }}"
      - name: configs (phase, condition ids, variant names)
        run: uv run ild check-configs configs/
      - name: benchmark gate (rebuild == committed, grid, schema, prompts, freeze)
        run: cd ../INSIDER_LLM_DETECTION_BENCHMARK && uv run --project "$GITHUB_WORKSPACE" python validate.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: retired vocabulary must not reappear
        run: |
          if grep -nE "reportable[^_]|zero .not_logged. episodes exist|two (true )?omissions|observed twice" README.md EXPERIMENTS.md; then
            echo "retired vocabulary found (see docs/audits/2026-09-01 in the research workspace)"; exit 1
          fi
