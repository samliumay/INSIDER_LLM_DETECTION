[project]
name = "insider-llm-detection"
version = "0.1.0"
description = "Detecting insider LLMs via double logging"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "openai>=1.70",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "python-dotenv>=1.0",
    "anthropic>=0.49",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ild = "insider_llm_detection.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insider_llm_detection"]
